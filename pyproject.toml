[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereviewbot"
version = "0.1.0"
description = "A Python agent for reviewing GitHub pull requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10"]

[tool.setuptools.packages.find]
where = ["src"]
